# Copy to sources.yaml when implementation begins. Values here are examples;
# no network job reads this file yet.
version: 1

defaults:
  interval_minutes: 180
  max_items_per_run: 20
  retention_days: 90
  media_policy: metadata_only
  enabled: false

sources:
  - id: example-tech-feed
    platform: web
    mode: feed
    locator: https://example.com/feed.xml
    language: [en]
    topics: [technology]

  - id: example-chinese-feed
    platform: web
    mode: feed
    locator: https://example.cn/rss.xml
    language: [zh]
    topics: [technology, society]

  - id: example-podcast
    platform: podcast
    mode: feed
    locator: https://example.com/podcast.xml
    language: [en]
    topics: [technology]
    media_policy: captions

  - id: podcast-index-discovery
    platform: podcast_index
    mode: api
    locator: search:technology film society
    credentials_ref: env:PODCAST_INDEX_CREDENTIALS
    language: [en, zh]
    topics: [technology, film, society]
    max_items_per_run: 10

  - id: reddit-technology
    platform: reddit
    mode: api
    locator: subreddit:technology
    credentials_ref: env:REDDIT_OAUTH
    language: [en]
    topics: [technology, society]

  - id: x-curated-list
    platform: x
    mode: api
    locator: list:REPLACE_WITH_LIST_ID
    credentials_ref: env:X_BEARER_TOKEN
    language: [en, zh]
    topics: [technology, film, society]
    max_items_per_run: 25

  - id: wechat-account-via-wewe-rss
    platform: wechat
    mode: feed
    locator: http://127.0.0.1:4000/feeds/MP_WXS_REPLACE.atom
    language: [zh]
    topics: [technology, film, society]
    media_policy: metadata_only
    interval_minutes: 360
    retention_days: 180
    notes: >
      Preferred WeChat path. WeWe RSS (or Wechat2RSS) handles the WeChat side and
      exposes one Atom feed per account. Our pipeline only consumes the feed.

  - id: wechat-account-via-rsshub-homepage
    platform: wechat
    mode: feed
    locator: http://127.0.0.1:1200/wechat/mp/homepage/REPLACE_BIZ/REPLACE_HID
    language: [zh]
    topics: [technology, society]
    media_policy: metadata_only
    interval_minutes: 720
    notes: >
      Only works for accounts whose share link contains `homepage`.
      Keep frequency low; the upstream endpoint is anti-crawler sensitive.

  - id: wechat-url-inbox
    platform: wechat
    mode: manual
    locator: inbox:wechat
    language: [zh]
    topics: [technology, film, society]
    notes: Per-article browser capture fallback for a specific link.

  - id: telegram-public-preview
    platform: telegram
    mode: preview
    locator: channel:NewlearnerChannel
    language: [en, zh]
    topics: [technology, society]
    media_policy: metadata_only
    interval_minutes: 45
    max_items_per_run: 20
    retention_days: 90
    enabled: false
    notes: >
      No credentials required. Uses https://t.me/s/<channel> via
      tools/telegram_preview.py: 20 posts per page, page backwards with
      ?before=<lowest message id>. Public channels only.

  - id: telegram-selected-channels
    platform: telegram
    mode: mtproto_user
    locator: selected_channels
    credentials_ref: env:TELEGRAM_API_ID_AND_HASH
    language: [en, zh]
    topics: [technology, film, society]
    media_policy: metadata_only
    retention_days: 90
    enabled: false
    security:
      session_path: outside_repository
      require_explicit_channel_allowlist: true
      persist_login_code: false
    notes: >
      Optional upgrade path. Only enable if an api_id becomes available.
      Backfill is bounded (20-100 messages per channel); incremental sync uses
      min_id = last_message_id. See docs/TELEGRAM.md.

  - id: telegram-desktop-export
    platform: telegram
    mode: manual
    locator: import:telegram-result.json
    language: [en, zh]
    topics: [technology, film, society]
    media_policy: metadata_only
    enabled: false
    notes: >
      One-time history import from Telegram Desktop -> Export Telegram data.
      Per the official schema, public channel exports may only contain messages
      you sent, so this is most valuable for private channels and groups.
      See docs/TELEGRAM-NO-API.md.

  - id: weibo-browser-selection
    platform: weibo
    mode: browser
    locator: inbox:weibo
    language: [zh]
    topics: [technology, film, society]
    browser:
      endpoint: http://127.0.0.1:9222
      scope: selected_urls_only
      persist_cookies: false

  - id: bilibili-browser-selection
    platform: bilibili
    mode: browser
    locator: inbox:bilibili
    language: [zh]
    topics: [technology, film, society]
    media_policy: captions
    browser:
      endpoint: http://127.0.0.1:9222
      scope: selected_urls_only
      persist_cookies: false

  - id: xiaoyuzhou-browser-selection
    platform: podcast
    mode: browser
    locator: inbox:xiaoyuzhou
    language: [zh, en]
    topics: [technology, film, society]
    media_policy: metadata_only
    browser:
      endpoint: http://127.0.0.1:9222
      scope: selected_urls_only
      persist_cookies: false
