# Newsletter pipeline configuration.
#
# Every value here is also a built-in default, so deleting any line changes
# nothing. Precedence, highest first:
#
#     CLI flag  >  NEWSLETTER_* env var  >  this file  >  built-in default
#
# See what is actually in effect, and where each value came from:
#
#     make config
#     ./.venv/bin/python tools/collect.py --show-config
#
# Unknown keys are rejected, so a typo fails loudly instead of doing nothing.

[ai]
# Backend CLI for the two AI stages. "none" skips the model entirely, which is
# the only way to turn the AI layer off.
# Adding a backend is one entry in tools/ai_model.py BACKEND_TABLE.
backend = "pi"
# Model passed to the backend. For pi this is any id from `pi --list-models`.
# Leave empty to let the backend choose its own default.
model = "deepseek-v4.1-flash"
# Seconds before a backend call is abandoned.
timeout = 900
# Reuse an existing data/ai/*_decisions.json instead of calling the model again.
# Default false: every run asks the model afresh, because a decisions file is
# only valid for the day it was made — yesterday's ids do not describe today's
# items, and for URL-keyed sources (Hacker News, feeds) a stale file would be
# applied to the wrong data without any error. Set true to save a call when
# re-running the same day; a file from another day is still regenerated.
reuse = false
# Extra arguments appended to the backend command, just before the prompt.
# An escape hatch for backend-specific tuning; normally empty.
args = []

[collect]
# Extraction engine:
#   modern  trafilatura + feedparser; keeps inline links and headings (default)
#   legacy  standard library only; hand-rolled regex, no dependencies
engine = "modern"
# Full-text policy for article bodies:
#   today   only items published today get their body fetched (default)
#   latest  the most recent items, regardless of date
#   all     every item
#   none    never fetch bodies
#   <N>     the N most recent items
fulltext = "today"
# Download Telegram post images. They are inlined into the digest as base64.
images = true
images_per_post = 2
image_cap = 200
# Global per-source item limit. 0 means "use sources.limits below".
limit = 0

[telegram]
# Public channels to follow. Adding one is a single string; no code change.
# Its nature comes from [sources.units] below — a channel missing from there is
# news, like the seven that were here before.
channels = ["MaiTungNews", "tnews365", "zaihuapd", "xhqcankao",
            "GodlyNews1", "NewlearnerChannel", "DNSPODT",
            "douView", "Vwyxrd", "CNSmydream",
            "reorx_share", "notonlyshare", "bigwalnut", "codedump_notes",
            "hacker_news_zh", "gledos_microblogging",
            "wxbyg", "zhihu_bazaar"]
# Pages of roughly 20 posts to walk per channel.
pages = 4
# Which day's messages to keep: auto | today | yesterday | YYYY-MM-DD.
# "auto" picks the newest day any channel actually posted in.
day = "auto"

[hackernews]
# topstories | beststories | newstories | askstories | showstories
feed = "topstories"

[sources]
# Panel order. Purely ordering: every registered source still runs, and any not
# named here is appended in its built-in position. To actually turn a source
# off, list the ones you want in `enabled` below.
order = ["sspai", "telegram", "linuxdo", "latepost", "geekpark", "solidot",
         "ruanyifeng", "anywayfm", "hackernews", "weibo", "zhihu"]
# Optional whitelist: when non-empty, only these sources are collected.
# Empty means "everything in order".
enabled = []

# Per-source item limits.
[sources.limits]
sspai = 20
telegram = 400
linuxdo = 300
latepost = 15
geekpark = 15
ruanyifeng = 10
anywayfm = 10
hackernews = 15
weibo = 15
zhihu = 15

# Which sources are not news. Anything unlisted is news.
#
#   discussion  sharing and community threads -> stage 2d, the 讨论 block
#   longform    irregularly updated long reads -> no category at all, its own
#               panel only (a weekly newsletter is not a day's news)
[sources.nature]
discussion = ["linuxdo", "hackernews"]
longform = ["ruanyifeng", "anywayfm"]

# Per-unit overrides for the sources that carry more than one nature.
# Key is "<source>:<unit>", where the unit is a Telegram channel or a linux.do
# section name. A unit not listed here follows its source, so only the
# exceptions appear below.
[sources.units]
"telegram:reorx_share" = "discussion"
"telegram:notonlyshare" = "discussion"
"telegram:bigwalnut" = "discussion"
"telegram:codedump_notes" = "discussion"
"telegram:hacker_news_zh" = "discussion"
"telegram:gledos_microblogging" = "discussion"
"telegram:wxbyg" = "longform"
"telegram:zhihu_bazaar" = "longform"
"linuxdo:站外速览" = "news"

# Panel display names.
[sources.labels]
sspai = "少数派"
telegram = "Telegram"
linuxdo = "linux.do 晚报"
latepost = "晚点 LatePost"
geekpark = "极客公园"
solidot = "奇客 Solidot"
ruanyifeng = "阮一峰的网络日志"
anywayfm = "Anyway.Now 安妮薇看看"
hackernews = "Hacker News"
weibo = "微博热搜"
zhihu = "知乎热榜"

[output]
# Where the single-file digest is written.
digest = "site/digest.html"

[archive]
# Root directory for daily snapshots. Git-ignored.
root = "archive"

[paths]
collected = "data/collected"
ai = "data/ai"
processed = "data/processed"

# Generic RSS/Atom sources. Each entry needs an id and a url; adding one requires
# no code. For sites that need special handling (fallback APIs, URL rewriting,
# non-RSS list pages) keep using a module in tools/collectors/ instead.
#
# [[feeds]]
# id       = "example-blog"
# name     = "示例博客"
# url      = "https://example.com/feed.xml"
# fulltext = "today"
# limit    = 20

# 奇客 Solidot. The feed carries a 200–450 字 summary per story, which is
# enough to classify and to show, so full text is off: the article page also
# carries "solidot 新版网站常见问题" and a view counter that would end up
# inside 阅读全文.
[[feeds]]
id       = "solidot"
name     = "奇客 Solidot"
url      = "https://www.solidot.org/index.rss"
fulltext = "none"
limit    = 20
