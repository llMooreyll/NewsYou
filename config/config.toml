# Newsletter pipeline configuration.
#
# Every value here is also a built-in default, so deleting any line changes
# nothing. Precedence, highest first:
#
#     CLI flag  >  NEWSLETTER_* env var  >  this file  >  built-in default
#
# See what is actually in effect, and where each value came from:
#
#     make config
#     ./.venv/bin/python tools/collect.py --show-config
#
# Unknown keys are rejected, so a typo fails loudly instead of doing nothing.

[ai]
# Backend CLI for the two AI stages. "none" skips the model entirely, which is
# the only way to turn the AI layer off.
# Adding a backend is one entry in tools/ai_model.py BACKEND_TABLE.
backend = "pi"
# Model passed to the backend. For pi this is any id from `pi --list-models`.
# Leave empty to let the backend choose its own default.
model = "deepseek-v4.1-flash"
# Seconds before a backend call is abandoned.
timeout = 900
# Reuse an existing data/ai/*_decisions.json instead of calling the model again.
# Default false: every run asks the model afresh, because a decisions file is
# only valid for the day it was made — yesterday's ids do not describe today's
# items, and for URL-keyed sources (Hacker News, feeds) a stale file would be
# applied to the wrong data without any error. Set true to save a call when
# re-running the same day; a file from another day is still regenerated.
reuse = false
# Extra arguments appended to the backend command, just before the prompt.
# An escape hatch for backend-specific tuning; normally empty.
args = []

[collect]
# Extraction engine:
#   modern  trafilatura + feedparser; keeps inline links and headings (default)
#   legacy  standard library only; hand-rolled regex, no dependencies
engine = "modern"
# Full-text policy for article bodies:
#   today   only items published today get their body fetched (default)
#   latest  the most recent items, regardless of date
#   all     every item
#   none    never fetch bodies
#   <N>     the N most recent items
fulltext = "today"
# Download Telegram post images. They are inlined into the digest as base64.
images = true
images_per_post = 2
image_cap = 200
# Global per-source item limit. 0 means "use sources.limits below".
limit = 0
# Concurrent fetches. Nearly all of a run is spent waiting on other people's
# servers, so threads cut the wall clock a lot; the ceiling is politeness, not
# the machine. 1 = strictly serial.
workers = 4

[telegram]
# Public channels to follow. Adding one is a single string; no code change.
# Its nature comes from [sources.units] below — a channel missing from there is
# news, like the seven that were here before.
channels = ["MaiTungNews", "tnews365", "zaihuapd", "xhqcankao",
            "GodlyNews1", "NewlearnerChannel", "DNSPODT",
            "douView", "Vwyxrd", "CNSmydream",
            "reorx_share", "notonlyshare", "bigwalnut", "codedump_notes",
            "hacker_news_zh", "gledos_microblogging",
            "wxbyg", "zhihu_bazaar"]
# Pages of roughly 20 posts to walk per channel.
pages = 4
# Which day's messages to keep: auto | today | yesterday | YYYY-MM-DD.
# "auto" picks the newest day any channel actually posted in.
day = "auto"

[hackernews]
# topstories | beststories | newstories | askstories | showstories
feed = "topstories"

[v2ex]
# The hot board, already sorted by reply count. `?tab=hot` is the only tab
# V2EX sorts; all/recent are in posting order and useless for a hottest list.
sort = "hot"

[reddit]
# Off by default (see `sources.disabled`): it works, but it is slow. Nothing
# below takes effect until it is switched back on.
#
# Read through the public Atom feeds, which need no login. Each feed returns 25
# posts with a title, a permalink and an author — no score and no comment count.
# Reddit's own `hot` ordering is the ranking, so that is not a loss.
#
# The rate limit is about one request per minute per address and is not lifted
# by changing the user agent, so these are fetched strictly serially with
# `delay` between them: three subreddits cost about two minutes of waiting.
# Lowering it below ~60s starts returning 429 with an empty body.
subreddits = ["hardware", "technology", "godot"]
sort = "hot"
delay = 60

[sources]
# Panel order. Purely ordering: every registered source still runs, and any not
# named here is appended in its built-in position. To actually turn a source
# off, list the ones you want in `enabled` below.
order = ["sspai", "telegram", "linuxdo", "latepost", "geekpark", "solidot",
         "ruanyifeng", "anywayfm", "hackernews", "v2ex", "reddit", "weibo",
         "zhihu"]
# Optional whitelist: when non-empty, only these sources are collected.
# Empty means "everything in order".
enabled = []
# Sources to switch off by name. `weibo` is off because its hot-search list is
# noisy and its content rarely survives a day; the collector and its board
# renderer are both still here, so removing the name below turns it back on.
# `reddit` is off because it is slow, not because it is broken: the public feeds
# allow about one request a minute, so three subreddits add two minutes of
# waiting to every run. Same deal — delete the name to bring it back.
disabled = ["weibo", "reddit"]

# Hours subtracted from a source's `day_start_hour`. linux.do is listed at 21
# and actually publishes at 22:00, and this is why: an edition that slips half
# an hour late must not fall out of its own day.
day_start_grace_hours = 1

# Sources whose response is a *ranking of what is current*, not a feed of dated
# publications. Every item in such a response is current by construction, so the
# day window does not apply to them: their timestamps say when the underlying
# thing was created, which is not the question being asked.
#
#   zhihu       热榜按热度排序，时间戳是「提问时间」——实测第 2、6 名分别是
#               20.7 和 25.6 小时前提出的，但它们就是此刻第 2、第 6 热的话题。
#   hackernews  `topstories` 是首页排名，最老的能到 3.4 天前（前 20 条里有 8 条
#               是 2–3 天前的），而且顺序不按分数——它是排名，不是时间流。
#   v2ex        热帖榜按回复数排序，时间戳是「最后回复」，衡量的是活跃度而非发布。
#   weibo       榜单本身没有发布时间，用抓取时刻代替，因此本来就总是「当日」。
#
# Anyway.Now 不在此列：/now/ 是按时间倒序的推荐列表，旧条目确实旧，窗口只留最新
# 的那几条是对的。
# 一个列表，两种粒度：写源名给整个源打标，写 `<源>:<单元>` 只给一个频道/分节
# 打标（键的写法与 `sources.units` 一致）。被打了标的内容不走「当日」判断。
snapshot = ["zhihu", "hackernews", "v2ex", "weibo"]

# Per-source item limits.
[sources.limits]
sspai = 20
telegram = 400
linuxdo = 300
latepost = 15
geekpark = 15
ruanyifeng = 10
anywayfm = 10
hackernews = 15
v2ex = 40
# Three subreddits x 25 posts per feed. The feeds are fetched one per minute
# (see below), so this number only decides how many are kept.
reddit = 75
weibo = 15
zhihu = 15

# Which sources are not news. Anything unlisted is news.
#
#   discussion  sharing and community threads -> stage 2d, the 讨论 block
#   longform    irregularly updated long reads -> no category at all, its own
#               panel only (a weekly newsletter is not a day's news)
#
# NOTE: each list *replaces* the built-in default rather than adding to it, so
# naming one source means naming all of them. Leaving a source out silently
# puts it back in the news side.
[sources.nature]
discussion = ["linuxdo", "hackernews", "v2ex", "reddit"]
longform = ["sspai", "latepost", "geekpark", "ruanyifeng", "anywayfm"]

# Per-unit overrides for the sources that carry more than one nature.
# Key is "<source>:<unit>", where the unit is a Telegram channel, a linux.do
# section name, or — for sspai — 派早报, which the collector sets on each story
# it splits out of the daily brief. A unit not listed here follows its source,
# so only the exceptions appear below.
[sources.units]
# sspai is long-form, except the brief: its stories are a day's news and are
# the only part of that source that reaches classification.
"sspai:派早报" = "news"

"telegram:reorx_share" = "discussion"
"telegram:notonlyshare" = "discussion"
"telegram:bigwalnut" = "discussion"
"telegram:codedump_notes" = "discussion"
"telegram:hacker_news_zh" = "discussion"
"telegram:gledos_microblogging" = "discussion"
"telegram:wxbyg" = "longform"
"telegram:zhihu_bazaar" = "longform"
"linuxdo:站外速览" = "news"

# What counts as "today" for a source, as the hour its day begins in
# Asia/Shanghai. A source absent here starts at midnight, which is what most of
# them want.
#
# linux.do is the reason this exists. It publishes its 晚报 as one batch at
# 22:00, so the previous evening's edition is the one that belongs to today —
# judged against midnight, every item it has is yesterday's and the whole source
# drops out of the daily summary. Listing 21 rather than 22 is deliberate: the
# publication time is a habit, not a contract, and an edition running half an
# hour late must not fall out of its own day.
#
# This window is what "today" means everywhere it is asked: which items reach
# the summary and the classification, and which get their full text fetched.
[sources.day_start_hour]
linuxdo = 21

# Hours subtracted from a start hour above. A source with no start hour is
# unaffected, so midnight stays midnight.

# Panel display names.
[sources.labels]
sspai = "少数派"
telegram = "Telegram"
linuxdo = "linux.do 晚报"
latepost = "晚点 LatePost"
geekpark = "极客公园"
solidot = "奇客 Solidot"
ruanyifeng = "阮一峰的网络日志"
anywayfm = "Anyway.Now 安妮薇看看"
hackernews = "Hacker News"
v2ex = "V2EX"
reddit = "Reddit"
weibo = "微博热搜"
zhihu = "知乎热榜"

[output]
# Where the single-file digest is written.
digest = "site/digest.html"

[archive]
# Root directory for daily snapshots. Git-ignored.
root = "archive"

[paths]
collected = "data/collected"
ai = "data/ai"
processed = "data/processed"

# Generic RSS/Atom sources. Each entry needs an id and a url; adding one requires
# no code. For sites that need special handling (fallback APIs, URL rewriting,
# non-RSS list pages) keep using a module in tools/collectors/ instead.
#
# [[feeds]]
# id       = "example-blog"
# name     = "示例博客"
# url      = "https://example.com/feed.xml"
# fulltext = "today"
# limit    = 20

# 奇客 Solidot. The feed carries a 200–450 字 summary per story, which is
# enough to classify and to show, so full text is off: the article page also
# carries "solidot 新版网站常见问题" and a view counter that would end up
# inside 阅读全文.
[[feeds]]
id       = "solidot"
name     = "奇客 Solidot"
url      = "https://www.solidot.org/index.rss"
fulltext = "none"
limit    = 20
